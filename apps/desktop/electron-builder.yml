appId: app.trailerforge.desktop
productName: TrailerForge
asar: false
npmRebuild: false
directories:
  output: release
  app: stage
files:
  - '**/*'
  - '!**/@resvg/resvg-js-{linux-*,darwin-*,android-*,freebsd-*,win32-arm64-*,win32-ia32-*}/**'
win:
  target:
    - target: nsis
      arch: [x64]
  signAndEditExecutable: false
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: TrailerForge-Setup-${version}.${ext}
extraResources:
  - from: stage/node_modules
    to: app/node_modules
  - from: ../ui/dist
    to: ui
  - from: ../../assets
    to: assets
  - from: ../../workers/analysis
    to: analysis
    filter:
      - pyproject.toml
      - uv.lock
      - .python-version
      - src/**/*
      - '!**/__pycache__'
      - '!**/*.pyc'
  - from: vendor/uv
    to: uv
  - from: vendor/effectcraft
    to: effectcraft
    filter:
      - effectcraft-cli.exe
  - from: third-party/effectcraft
    to: effectcraft
  - from: ../../packages/effectcraft/templates
    to: effectcraft/templates
