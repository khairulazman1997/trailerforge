[project]
name = "tforge-analysis"
version = "0.0.0"
description = "TrailerForge analysis sidecar (JSON-RPC over stdio)"
requires-python = ">=3.11"
dependencies = [
    "librosa>=0.11",
    # numba 0.68 with numpy 2.5 crashes (access violation) in librosa beat tracking on Windows.
    "numba<0.68",
    "numpy>=2",
    "onnxruntime>=1.20",
    "opencv-python-headless>=4.10",
    "scenedetect>=0.7,<0.8",
    "tokenizers>=0.20",
]

[dependency-groups]
dev = [
    "onnx>=1.17",
    "opentimelineio>=0.17",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tforge_analysis"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
